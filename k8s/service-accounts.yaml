# No pod here needs the Kubernetes API: the app's account and the namespace's default
# mount no API token, and no RBAC binds them. The app's pod has a token only for storage
# (app.yaml), which can't reach the Kubernetes API. The image is public: no pull secret.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: app
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
automountServiceAccountToken: false
